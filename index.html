<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOCMETRY | EDERUS</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Guía del Survival de Ederus: equipo, anomalías, cajas, economía y rangos."><meta name="robots" content="noindex">
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#091118;--void-2:#0d1824;--dusk:#132231;--dusk-2:#192c41;--line:#243c55;
  --azure:#00B2FF;--azure-soft:#5FC8FF;--azure-deep:#0081B9;--ice:#A1D8FF;--gold:#ffc94a;
  --font-display:"Sora",sans-serif;--font-body:"Instrument Sans",sans-serif;
  --font:"Instrument Sans",sans-serif;
  --paper:#0d1824;--panel:#132231;--ink:#e8f2fa;--muted:#8fa6bd;
  --rule:#243c55;--rule-strong:#2f4c6b;--accent:#00B2FF;--accent-soft:#17273a;--bronze:#ffc94a;
  --q-comun:#8fa6bd;--q-poco:#4ade80;--q-raro:#5FC8FF;--q-legend:#ffc94a;--q-inmortal:#c58cff;
  --pos:#4ade80;--warn:#ffb454;--warn-soft:#2a2113;--mc:#ffc94a;
}
*{box-sizing:border-box}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--font);padding:clamp(18px,4vw,44px)}
  .doc{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  h1{margin:0;font-weight:700;font-size:clamp(22px,4vw,29px);line-height:1.1;letter-spacing:-.02em}
  .subtitle{color:var(--muted);font-size:14px;margin-top:-14px}

  .tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--rule-strong);position:sticky;top:0;background:var(--paper);z-index:5;padding-top:2px}
  .tab{appearance:none;border:none;background:none;font:600 13.5px var(--font);color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .panel[hidden]{display:none}
  .panel{display:flex;flex-direction:column;gap:20px;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.panel{animation:none}}

  section{display:flex;flex-direction:column;gap:12px}
  .sec-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule-strong);padding-bottom:6px}
  .sec-n{font-weight:700;font-size:12px;color:var(--accent)}
  h2{margin:0;font-weight:700;font-size:19px;letter-spacing:-.01em}
  h3{margin:8px 0 2px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
  p{margin:0}
  ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:5px}
  li{padding-left:2px}
  strong{font-weight:600}
  code{font-family:var(--font);font-weight:600;font-size:.92em;background:var(--panel);padding:1px 5px;border-radius:4px}
  .fine{font-size:12.5px;color:var(--muted)}

  /* Playtime */
  .scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:8px}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
  table.data thead th{background:var(--accent-soft);text-align:left;font-weight:700;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);padding:9px 11px;border-bottom:2px solid var(--rule-strong);white-space:nowrap;position:sticky;top:0}
  table.data td{padding:7px 11px;border-bottom:1px solid var(--rule);vertical-align:top}
  table.data tr:last-child td{border-bottom:none}
  .lvl,.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .num{text-align:right}
  .lvl{font-weight:700}
  .hrs{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .dash{color:var(--muted)}
  .items{display:flex;flex-wrap:wrap;gap:4px 5px}
  .it{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--rule-strong);background:var(--paper);white-space:nowrap;line-height:1.65}
  .it.key{border-color:color-mix(in srgb,var(--bronze) 45%,var(--rule-strong))}
  .it.gkit{font-weight:600;border-color:color-mix(in srgb,var(--q-inmortal) 45%,transparent);background:color-mix(in srgb,var(--q-inmortal) 9%,var(--paper))}
  .it.book{font-weight:600;border-color:color-mix(in srgb,var(--q-legend) 55%,transparent);background:color-mix(in srgb,var(--q-legend) 12%,var(--paper))}
  .it.tag{border-style:dashed}
  .qd{width:8px;height:8px;border-radius:50%;flex:none}
  tr.mile td{background:color-mix(in srgb,var(--bronze) 6%,transparent)}
  tr.mile-major td{background:color-mix(in srgb,var(--bronze) 12%,transparent)}
  tr.s67 td{background:color-mix(in srgb,var(--q-inmortal) 9%,transparent)}
  tr.mile .lvl,tr.mile-major .lvl{color:var(--bronze)}
  tr.s67 .lvl{color:var(--q-inmortal)}
  .qkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
  .qkey .q{display:inline-flex;align-items:center;gap:6px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .tile{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
  .tile .k{font-weight:700;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:12px;color:var(--muted);font-weight:400}

  /* Crates enriquecidas (desplegables al clic) */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px;align-items:start}
  details.ccard{--tier:var(--accent);background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--tier);border-radius:10px;overflow:hidden}
  details.ccard.dead{opacity:.66}
  details.ccard>summary{list-style:none;cursor:pointer}
  details.ccard>summary::-webkit-details-marker{display:none}
  details.ccard>summary:focus-visible{outline:2px solid var(--tier);outline-offset:-2px}
  .ccard-top{padding:13px 15px 12px;display:flex;flex-direction:column;gap:9px}
  .ccard-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .ccard-title .nm{font-weight:700;font-size:16px;line-height:1.1}

  /* Cara del mob base de cada anomalia */
  .anom-id{display:flex;align-items:center;gap:11px;min-width:0}
  .mface{--glow:var(--rule-strong);position:relative;flex:none;width:46px;height:46px;border-radius:11px;
    background-color:#0a1119;background-repeat:no-repeat;image-rendering:pixelated;
    box-shadow:0 0 0 1.5px color-mix(in srgb,var(--glow) 72%,transparent),0 0 14px -2px color-mix(in srgb,var(--glow) 60%,transparent),inset 0 0 0 1px rgba(0,0,0,.45);
    transition:transform .18s ease,box-shadow .18s ease,filter .18s ease,opacity .18s ease}
  .mface::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(115% 80% at 50% 0%,rgba(255,255,255,.17),rgba(255,255,255,0) 62%),linear-gradient(180deg,rgba(0,0,0,0) 52%,rgba(0,0,0,.3))}
  .mface.dim{filter:grayscale(.78) brightness(.86) contrast(1);opacity:.86;
    box-shadow:0 0 0 1.5px rgba(143,166,189,.32),inset 0 0 0 1px rgba(0,0,0,.5)}
  .mface.dim::after{background:linear-gradient(180deg,rgba(19,34,49,.08),rgba(19,34,49,.46))}
  details.ccard>summary:hover .mface{transform:translateY(-1px) scale(1.06);
    box-shadow:0 0 0 1.5px var(--glow),0 0 22px -2px color-mix(in srgb,var(--glow) 80%,transparent),inset 0 0 0 1px rgba(0,0,0,.45)}
  details.ccard>summary:hover .mface.dim{filter:grayscale(.4) brightness(.92) contrast(1);opacity:1;
    box-shadow:0 0 0 1.5px rgba(143,166,189,.55),inset 0 0 0 1px rgba(0,0,0,.5)}
  @media (prefers-reduced-motion:reduce){.mface{transition:none}details.ccard>summary:hover .mface{transform:none}}
  .rcount{display:flex;flex-direction:column;align-items:center;line-height:1;flex:none;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:5px 9px}
  .rcount b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--tier)}
  .rcount span{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .ccard-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .badge{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--tier) 15%,var(--paper));color:var(--tier);border:1px solid color-mix(in srgb,var(--tier) 35%,transparent)}
  .badge.fac{background:color-mix(in srgb,var(--fac) 16%,var(--paper));color:var(--fac);border-color:color-mix(in srgb,var(--fac) 45%,transparent)}
  .keychip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px dashed var(--rule-strong);color:var(--muted)}
  .keychip.has{border-style:solid;border-color:color-mix(in srgb,var(--bronze) 45%,transparent);color:var(--bronze);background:color-mix(in srgb,var(--bronze) 10%,var(--paper))}
  .expand{margin-left:auto;font-size:11px;font-weight:600;color:var(--tier);white-space:nowrap}
  .expand::before{content:"+ "}
  details.ccard[open] .expand::before{content:"– "}
  .expand::after{content:"Ver contenido"}
  details.ccard[open] .expand::after{content:"Ocultar"}
  .ccard-body{padding:11px 15px 14px;display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--rule)}
  .ccard-body ul{padding-left:16px;font-size:12.5px;gap:5px;color:var(--ink)}
  .ccard-body ul li::marker{color:var(--tier)}
  .ccard-body .inline{font-size:12.5px;color:var(--ink);line-height:1.7}
  .myth{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--q-inmortal);border:1px solid color-mix(in srgb,var(--q-inmortal) 40%,transparent);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
  .flag{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:7px 10px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}

  /* Libros enriquecidos */
  details{background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:0 14px;overflow:hidden}
  summary{cursor:pointer;padding:12px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+";font-weight:700;color:var(--accent);font-size:15px;width:14px;display:inline-block}
  details[open] summary::before{content:"–"}
  .cl{font-weight:700;font-size:15px}
  .clc{font-size:11.5px;color:var(--muted)}
  .price{margin-left:auto;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--pos) 40%,transparent);color:var(--pos);background:color-mix(in srgb,var(--pos) 10%,var(--paper))}
  .price.locked{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn);background:var(--warn-soft)}
  .enchgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:8px;padding:2px 0 14px}
  .ench{background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:8px 11px}
  .ench .en{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ench .engname{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10.5px;font-weight:600;color:var(--azure-soft);background:color-mix(in srgb,var(--azure) 12%,var(--paper));border:1px solid color-mix(in srgb,var(--azure) 40%,transparent);border-radius:5px;padding:0 6px;letter-spacing:.02em}
  .ench .ed{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
  .booknote{display:flex;flex-direction:column;gap:8px}

  /* Kits */
  .callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:11px 15px;border-radius:0 6px 6px 0;font-size:13px}

  /* Tiendas: filas de precio, sin scroll */
  .shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
  .shopcard{background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .shopcard h4{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;gap:8px}
  .shopcard h4 span{color:var(--muted);font-weight:600;text-align:right;white-space:nowrap}
  .prow{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule)}
  .prow:last-child{border-bottom:none}
  .prow .pn{flex:1;font-size:12.5px}
  .prow .pp{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
  .prow.sink .pp{color:var(--warn)}
  .prow.gainrow .pp{color:var(--pos)}
  /* Iconos de item (texturas 16x16 de Minecraft) */
  .prow.wico{align-items:center;gap:9px}
  .shopcard .lista{max-height:290px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
  .shopcard .lista::-webkit-scrollbar{width:6px}
  .shopcard .lista::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
  .shopgrid.buscando .shopcard .lista{max-height:none}
  .shopsearch{width:100%;margin:0 0 12px;padding:9px 12px;font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px}
  .shopsearch::placeholder{color:var(--muted)}
  .shopsearch:focus{outline:none;border-color:var(--accent)}
  .ico{width:22px;height:22px;flex:none;object-fit:contain;image-rendering:crisp-edges;image-rendering:pixelated}
  /* Tiendas: bloque de venta (ganas) frente a bloque de compra (gastas) */
  .shopblock{--sh:var(--accent);border:1px solid var(--rule);border-left:3px solid var(--sh);border-radius:0 10px 10px 0;padding:14px 16px;display:flex;flex-direction:column;gap:11px;background:color-mix(in srgb,var(--sh) 5%,var(--paper))}
  .shopblock.gain{--sh:var(--pos)}
  .shopblock.spend{--sh:var(--warn)}
  .blockhead{display:flex;flex-wrap:wrap;align-items:center;gap:7px 11px}
  .blockhead h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em;text-transform:none;color:var(--ink);font-family:var(--font-display)}
  .blocktag{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:var(--sh);border:1px solid color-mix(in srgb,var(--sh) 42%,transparent);background:color-mix(in srgb,var(--sh) 12%,var(--paper))}
  .blockhead .blocksum{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .shopblock .shopcard{background:var(--panel)}
  .shopblock .shopcard h4{color:var(--sh)}
  .mobcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 18px}
  .mobcgrid .prow .pp{color:var(--mc,var(--bronze))}

  /* Mazmorras */
  .dgsplit{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start}
  .prow .rq{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:-1px;flex:none}
  ol.flow{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:0}
  ol.flow li{counter-increment:st;position:relative;padding:0 0 14px 34px;font-size:13px}
  ol.flow li::before{content:counter(st);position:absolute;left:0;top:-1px;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);font:700 11px/20px var(--font);text-align:center}
  ol.flow li::after{content:"";position:absolute;left:11px;top:23px;bottom:0;width:1px;background:var(--rule)}
  ol.flow li:last-child{padding-bottom:0}
  ol.flow li:last-child::after{display:none}
  ol.flow b{color:var(--ink);font-weight:600}
  .dgstat{display:flex;flex-wrap:wrap;gap:5px 6px;margin-top:2px}
  .dgstat span{font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--rule-strong);background:var(--paper);color:var(--muted);white-space:nowrap}
  .dgstat span b{color:var(--ink);font-weight:600}
  @media print{ol.flow li::after{display:none}}

  @media print{
    @page{size:A4;margin:14mm}
    body{padding:0;font-size:10.5pt}
    .tabs{display:none}
    .panel[hidden]{display:flex!important}
    .panel{break-before:page;gap:16px}
    .panel:first-of-type{break-before:auto}
    section{break-inside:avoid}
    .scroll{overflow:visible;border:none}
    table.data{min-width:0}
    thead{display:table-header-group}
    tr,.ccard,.ench,.shopcard{break-inside:avoid}
    details{border:none;padding:0}
    details>*:not(summary){display:revert!important}
    summary::before{content:""}
    .expand{display:none}
    details.ccard{border:1px solid var(--rule);border-top:3px solid var(--tier)}
  }


  html{background:var(--void);font-size:16px}
  @media(min-width:1800px){html{font-size:18px}}
  body{background:transparent!important;color:var(--text,#e8f2fa)!important;padding:0!important;font-family:var(--font-body)}
  ::selection{background:var(--azure);color:#04121c}
  .sky{position:fixed;inset:0;z-index:-2;background:var(--void)}
  .sky::before{content:"";position:absolute;width:70vw;height:70vw;border-radius:50%;filter:blur(130px);opacity:.2;background:radial-gradient(circle,rgba(0,178,255,.4),transparent 65%);top:-30%;right:-20%}
  header.site{position:sticky;top:0;z-index:60;backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);background:rgba(9,17,24,.66);border-bottom:1px solid rgba(36,60,85,.5)}
  .topbar{display:flex;align-items:center;gap:.9rem;padding:.8rem 0;width:min(1080px,92%);margin-inline:auto}
  .brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--ink)}
  .brand__mark{height:36px;width:auto;flex:none}
  .brand__name{font-family:var(--font-display);font-weight:800;font-size:1.2rem}
  .brand__tag{font-family:var(--font-body);font-weight:600;font-size:.62rem;color:var(--azure);letter-spacing:.2em;margin-left:.25rem;border:1px solid var(--line);padding:.2rem .5rem;border-radius:6px;text-transform:uppercase}
  .back{margin-left:auto;font-family:var(--font-body);font-weight:600;font-size:.8rem;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:.5rem .85rem;border-radius:10px;transition:border-color .25s,color .25s;white-space:nowrap}
  .back:hover{border-color:var(--azure);color:var(--ink)}
  .doc{max-width:min(1080px,92%)!important;margin:0 auto!important;padding:2.6rem 0 0!important}
  .doc__eyebrow{font-family:var(--font-body);font-weight:600;font-size:.78rem;letter-spacing:.2em;color:var(--ice);text-transform:uppercase;display:inline-flex;align-items:center;gap:.55rem}
  .doc__eyebrow::before{content:"";width:9px;height:9px;background:var(--ice);border-radius:3px}
  .doc>h1.title{font-family:var(--font-display);font-weight:800;font-size:clamp(1.9rem,4vw,2.7rem);letter-spacing:-.02em;line-height:1.05;margin:.7rem 0 .5rem;color:var(--ink);border:none;padding:0}
  .doc__intro{color:var(--muted);line-height:1.7;font-size:1rem;padding:1.1rem 1.4rem;background:var(--dusk);border:1px solid var(--line);border-left:3px solid var(--azure);border-radius:14px;margin-bottom:1.8rem}
  .doc__intro strong{color:var(--ink);font-weight:600}
  .tabs{position:static!important;background:transparent!important;border-bottom:2px solid var(--rule-strong)}
  .sec-h h2,.doc h2,.cl,.tile .v,.rcount b{font-family:var(--font-display)}
  .subtitle{display:none}
  footer.site{border-top:1px solid var(--line);padding:2.2rem 0;margin-top:2.6rem;color:var(--muted);font-size:.86rem}
  .foot{display:flex;justify-content:space-between;gap:1.2rem;flex-wrap:wrap;width:min(1080px,92%);margin-inline:auto}
  .foot a{color:var(--azure-soft);text-decoration:none}
  .foot a:hover{color:var(--azure);text-decoration:underline}

/* ===== DOC · base de datos interna. Hereda colores y fuentes de guia.html (Sora + Instrument Sans, azul EDERUS). ===== */
:root{--t-ex:#c58cff;--t-s:#ff6b6b;--t-a:#ffb454;--t-b:#4ade80;--t-c:#5FC8FF;--t-d:#8fa6bd;--tile:#0f1c2a;--tile-2:#16283b}
body{padding:0 !important;background:var(--paper)}
.dk{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.dk-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:rgba(9,17,24,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.dk-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.dk-brand img{height:30px;width:auto}
.dk-brand b{font:800 17px var(--font-display);letter-spacing:.04em}
.dk-tag{font:700 10px var(--font);letter-spacing:.14em;color:#0b1520;background:var(--gold);padding:3px 7px;border-radius:4px}
.dk-search{flex:1;max-width:620px;position:relative;min-width:0}
.dk-search input{width:100%;background:var(--void);border:1px solid var(--rule-strong);color:var(--ink);font:14px var(--font);padding:9px 12px 9px 34px;border-radius:7px}
.dk-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
.dk-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--rule-strong);border-radius:8px;max-height:70vh;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.dk-res a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
.dk-res a:hover,.dk-res a.sel{background:var(--dusk-2)}
.dk-res small{font-size:11px;color:var(--muted)}
.dk-back{margin-left:auto;font:600 13px var(--font);color:var(--muted);text-decoration:none;white-space:nowrap}
.dk-menu{display:none;background:var(--dusk);border:1px solid var(--rule-strong);color:var(--ink);font:600 13px var(--font);padding:7px 11px;border-radius:7px}
.dk-nav{position:sticky;top:53px;align-self:start;height:calc(100vh - 53px);overflow:auto;border-right:1px solid var(--rule);padding:14px 10px 40px max(10px,env(safe-area-inset-left,0px));background:var(--void)}
.dk-nav h4{font:700 10.5px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px}
.dk-nav a{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px}
.dk-nav a:hover{background:var(--dusk)}
.dk-nav a.on{background:var(--dusk-2);box-shadow:inset 3px 0 0 var(--azure)}
.dk-nav .n{margin-left:auto;font:600 11px var(--font);color:var(--muted)}
main.dk-main{min-width:0;padding:22px max(16px,env(safe-area-inset-right,0px)) 80px max(18px,env(safe-area-inset-left,0px))}
.view{display:none;max-width:1320px;margin:0 auto;gap:22px}
.view.on{display:grid}
.vh h1{font:800 clamp(26px,3.6vw,38px)/1.05 var(--font-display);margin:0 0 6px;letter-spacing:-.01em}
.vh p{margin:0;color:var(--muted);max-width:80ch}
.sect{display:grid;gap:10px}
.sect>h2{font:700 13px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--azure-soft);margin:0;padding-bottom:6px;border-bottom:1px solid var(--azure-deep);display:flex;gap:8px;align-items:center}
.sect>h2::before{content:"";width:9px;height:9px;background:var(--azure);display:inline-block}
.sub{font:700 15px var(--font-display);margin:6px 0 0}
/* atajos tipo base de datos */
.short{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.sc{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--tile);border:1px solid var(--rule);border-radius:8px;
  text-decoration:none;color:var(--ink);overflow:hidden;min-height:64px;transition:border-color .15s,background .15s}
.sc:hover{border-color:var(--azure-deep);background:var(--tile-2)}
.sc .art{height:100%;min-height:64px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--dusk-2),var(--void))}
.sc b{font-weight:600;font-size:14px;display:block}
.sc small{color:var(--muted);font-size:12px}
.sc .arr{padding-right:14px;color:var(--muted)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--tile);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.kpi .k{font:700 10.5px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:800 24px var(--font-display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
/* iconos */
.ic{position:relative;display:inline-block;width:32px;height:32px;flex:none;image-rendering:pixelated}
.ic img,.ic .tint{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.ic .tint{-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.ic.lg{width:44px;height:44px}
.face{width:36px;height:36px;border-radius:4px;overflow:hidden;image-rendering:pixelated;background-repeat:no-repeat;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.face img{width:100%;height:100%;image-rendering:pixelated}
/* filtros */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--tile);border:1px solid var(--rule);border-radius:8px;padding:8px}
.bar input[type=search]{background:var(--void);border:1px solid var(--rule-strong);color:var(--ink);font:13px var(--font);padding:7px 10px;border-radius:6px;min-width:180px;flex:1 1 200px}
.bar select{background:var(--void);border:1px solid var(--rule-strong);color:var(--ink);font:13px var(--font);padding:7px 8px;border-radius:6px}
.tg{background:var(--void);border:1px solid var(--rule-strong);color:var(--muted);font:600 12px var(--font);padding:6px 10px;border-radius:6px;cursor:pointer}
.tg.on{background:var(--azure-deep);border-color:var(--azure);color:#fff}
.tg.reset{margin-left:auto}
.cnt{font-size:12px;color:var(--muted)}
/* tier list tipo prydwen */
.tl{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--void)}
.tl-cols,.tl-row{display:grid;grid-template-columns:64px repeat(var(--nc),minmax(0,1fr))}
.tl-cols div{font:700 11px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--azure-soft);text-align:center;padding:8px 4px;background:var(--dusk);border-left:1px solid var(--rule)}
.tl-row{border-top:1px solid var(--rule)}
.tl-t{display:flex;align-items:center;justify-content:center;font:800 22px var(--font-display);color:#0b1520}
.tl-c{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;padding:8px;border-left:1px solid var(--rule);background:var(--panel);min-height:96px}
.tt{width:84px;display:grid;justify-items:center;gap:3px;padding:6px 4px 5px;background:var(--tile-2);border:1px solid var(--rule);border-radius:6px;cursor:pointer;position:relative;text-align:center}
.tt:hover{border-color:var(--azure)}
.tt .nm{font-size:10.5px;line-height:1.15;font-weight:600;max-height:2.3em;overflow:hidden}
.tt .pw{position:absolute;top:3px;right:3px;font:700 9px var(--font);background:rgba(0,0,0,.55);color:var(--gold);padding:1px 4px;border-radius:3px;font-variant-numeric:tabular-nums}
.tt.dim{opacity:.18}
/* tabla */
.tw{overflow:auto;border:1px solid var(--rule);border-radius:8px;max-height:70vh;background:var(--panel)}
.tw table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw th{position:sticky;top:0;z-index:1;background:var(--dusk-2);color:var(--azure-soft);font:700 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:9px 10px;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--rule-strong)}
.tw th.num,.tw td.num{text-align:right}
.tw th[aria-sort=ascending]::after{content:" ▲"}.tw th[aria-sort=descending]::after{content:" ▼"}
.tw td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.tw tr:hover td{background:var(--dusk)}
.tw td .row{display:flex;align-items:center;gap:9px}
.bcell{display:grid;grid-template-columns:minmax(60px,1fr) auto;gap:8px;align-items:center;min-width:140px}
.bcell i{display:block;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--azure-deep),var(--azure))}
.pill{display:inline-block;font:700 11px var(--font);padding:2px 8px;border-radius:4px;color:#0b1520;white-space:nowrap}
.tier-EX{background:var(--t-ex)}.tier-S{background:var(--t-s)}.tier-A{background:var(--t-a)}.tier-B{background:var(--t-b)}.tier-C{background:var(--t-c)}.tier-D{background:var(--t-d)}
.soft{font:600 11px var(--font);padding:2px 7px;border-radius:4px;background:var(--dusk-2);color:var(--ice);white-space:nowrap}
.hi{background:#5c1f22;color:#ffb3ad}.me{background:#4a3818;color:#ffd38a}
/* tarjetas comparativas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cc{background:var(--tile);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.cc h3{margin:0;font:700 15px var(--font-display);display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-variant-numeric:tabular-nums;text-align:right}
.meter{height:6px;background:var(--void);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--gold)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.stack span{display:flex;align-items:center;justify-content:center;font:700 10px var(--font);color:#0b1520;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* matriz VIP */
.mx td:first-child{font-weight:600;white-space:nowrap}
.mx td.c{text-align:center}
.yes{color:var(--pos);font-weight:700}.no{color:#5b6f85}

/* paneles: recomendaciones y pendientes */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.box{background:var(--tile);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.box h3{margin:0 0 8px;font:700 15px var(--font-display)}
.box ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13.5px}
.box.reco{border-color:var(--azure-deep)}
.box.fix{border-color:#7a2f2f}
.plist{display:grid;gap:6px}
.pi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--tile);border:1px solid var(--rule);border-radius:7px;padding:9px 12px;font-size:13.5px}
.pi a{font-size:12px;color:var(--azure-soft);white-space:nowrap}
/* fichas completas */
details.ficha{background:var(--tile);border:1px solid var(--rule);border-radius:8px}
details.ficha>summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.ficha>summary .k{font:700 10px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.fwrap{padding:0 14px 14px;display:grid;gap:6px}
details.fsec{border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
details.fsec>summary{cursor:pointer;padding:8px 12px;font-size:13.5px}
.fbody{padding:4px 14px 12px;font-size:13.5px;overflow-x:auto}
.fbody table{border-collapse:collapse;font-size:12.5px}
.fbody th,.fbody td{border:1px solid var(--rule);padding:4px 8px;text-align:left}
.fbody th{background:var(--dusk-2)}
.plan{background:var(--tile);border:1px solid var(--rule);border-radius:8px;padding:6px 22px 20px;font-size:14px;overflow-x:auto}
.plan h2{font:800 20px var(--font-display);margin:20px 0 8px;color:var(--ink)}
.plan table{border-collapse:collapse;font-size:13px;margin:8px 0}
.plan th,.plan td{border:1px solid var(--rule);padding:5px 9px;text-align:left}
.plan th{background:var(--dusk-2)}
/* ficha de detalle */
.dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--rule-strong);z-index:40;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;box-shadow:-20px 0 40px rgba(0,0,0,.45)}
.dr h3{font:800 20px var(--font-display);margin:6px 0 10px;display:flex;align-items:center;gap:10px}
.dr .x{float:right;background:var(--dusk);border:1px solid var(--rule-strong);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.dr.wide{width:min(780px,100%)}
.dh{font:700 14px var(--font-display);margin:16px 0 4px}.mut{color:var(--muted)}.sm{font-size:12px;line-height:1.45}
.sx{overflow-x:auto;margin-top:8px}.ht{width:100%;border-collapse:collapse;font-size:12.5px}
.ht th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--muted);font:600 11px var(--font);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--rule-strong)}
.ht td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}.ht td:first-child{min-width:220px}
.ht .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.ht td.hx{color:var(--gold);font-weight:700}.ht tr.off{opacity:.5}
.pieces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.pieces div{display:flex;gap:8px;align-items:center;background:var(--tile);border:1px solid var(--rule);border-radius:6px;padding:6px;font-size:12px}
@media (max-width:900px){.dk{grid-template-columns:minmax(0,1fr)}.dk-nav{position:fixed;inset:53px 0 0 0;height:auto;z-index:25;display:none}.dk-nav.show{display:block}.dk-menu{display:inline-block}.dk-back{display:none}}
@media (max-width:560px){.tl-cols,.tl-row{grid-template-columns:44px repeat(var(--nc),minmax(150px,1fr))}.tl{overflow-x:auto}.tt{width:72px}}
@media (prefers-reduced-motion:reduce){.sc{transition:none}}
</style>

 progresion(el){el.innerHTML=head('Rankup, playtime y misiones','Lo que se gana subiendo de rango, jugando horas y haciendo misiones.')+

  table(el.querySelector('#pt'),[{k:'nivel',l:'Nivel',t:'num'},{k:'horas',l:'Horas',t:'num'},{k:'dinero',l:'Dinero',t:'bar'},{k:'mobcoins',l:'MobCoins',t:'num'},{k:'exp',l:'Niveles de XP',t:'num'},{k:'extras',l:'Extras'}],D.playtime,{sort:'nivel',dir:1});
  table(el.querySelector('#ms'),[{k:'categoria',l:'Categoría'},{k:'mision',l:'Misión'},{k:'objetivo',l:'Objetivo'},{k:'dinero',l:'Dinero',t:'bar'},{k:'niveles',l:'Niveles',t:'num'},{k:'mobcoins',l:'MobCoins',t:'num'}],D.misiones,{filters:['categoria'],sort:'dinero'})},

  el.innerHTML=head('Rangos VIP',PUB?'Lo que da cada rango en el servidor.':'')+
  `<div class="tw"><table class="mx"><thead><tr><th>Beneficio</th><th>Sin rango</th><th>Aeris</th><th>Astral</th><th>Eternal</th><th>Monarch</th></tr></thead><tbody>${R.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'c':''}">${String(c).replace('✔','<span class="yes">✔</span>')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`+

 combate(el){el.innerHTML=head('Dificultad y hordas','Cuánto pega cada cosa con cada armadura. Overworld en Normal, Nether en Fácil, Dungeons en Difícil.')+
  `<div class="tw"><table><thead><tr><th>Golpe</th><th class="num">Sin armadura</th><th class="num">Diamante Prot IV</th><th class="num">Netherita Prot IV</th><th class="num">Armadura al tope</th></tr></thead><tbody>${[['Zombi',3,.25,.24,.12],['Élite de horda (zombi ×1,8)',5.4,.49,.47,.22],['Esqueleto',4,.35,.33,.16],['Creeper a bocajarro',43,9.75,8.42,1.72],['Piglin / wither del Nether',5,.45,.43,.2],['Élite del Nether',9,.94,.88,.36],['Ahogado de la Marea (pesca)',14,'2,4*','2,4*','2,4*'],['Zombi en Dungeons',4.5,.4,.38,.18]].map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'num':''}">${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="cnt">Daño que llega al jugador (20 de vida = 10 corazones). * La pesca extrema quita como mínimo el 12 % de tu vida por golpe.</p>`+
  `<div class="duo">${''}${pend('combate')}</div>`+fichas('combate')},
 calamity(el){el.innerHTML=head('Calamity y pesca','El modo hardcore: amenazas, Esencias, Altar, Forja y la pesca de Calamity.')+`<div class="duo">${pend('calamity')}</div>`+fichas('calamity')},

};
function show(id){if(!B[id])id='inicio';document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+id));
  if(!built[id]){const v=document.createElement('section');v.className='view on';v.id='v-'+id;main.appendChild(v);B[id](v);hydrate(v);built[id]=v}
  nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.v===id));window.scrollTo(0,0);dr.hidden=true}
function route(){const h=decodeURIComponent(location.hash.slice(1));const [v,q]=h.split('--');show(v||'inicio');if(q){const t=built[v]&&built[v].querySelector('[id^=tb],#tb,#tl')}}
window.addEventListener('hashchange',route);route();
const mb=document.getElementById('mbtn');mb.onclick=()=>{const s=nav.classList.toggle('show');mb.setAttribute('aria-expanded',s)};nav.addEventListener('click',e=>{if(e.target.closest('a'))nav.classList.remove('show')});

const IDX=[...D.armaduras.map(s=>({t:s.nombre,s:'Armadura · '+s.origen+' · '+NF.format(s.poder),v:'tl-armaduras',i:ico(s.icon,s.dye),go:()=>setDetail(s)})),
 ...D.armas.map(a=>({t:a.nombre,s:'Arma · '+a.clase+' · '+NF.format(a.poder),v:'tl-armas',i:ico(a.icon),go:()=>armaDetail(a)})),
 ...D.anomalias.map(a=>({t:a.nombre,s:'Anomalía · '+a.clase,v:'tl-anomalias',i:face(a),go:()=>anDetail(a)})),
 ...D.premios.map(p=>({t:p.premio,s:'Premio · Caja '+p.caja+' · '+NF.format(p.pct)+' %',v:'cajas',i:ico('tripwire_hook'),f:p.premio})),
 ...D.encantamientos.map(e=>({t:e.nombre,s:'Encantamiento · '+e.tier,v:'encantamientos',i:ico('enchanted_book'),f:e.nombre})),
 ...D.jefes.map(j=>({t:j.mob,s:'Mob de mazmorra · '+NF.format(j.vida)+' de vida',v:'mazmorras',i:j.skin?`<span class="face"><img alt="" src="${j.skin}"></span>`:ico(j.icon),f:j.mob})),
 ...D.mascotas.map(m=>({t:m.mascota,s:'Mascota',v:'mascotas',i:ico(m.icon),f:m.mascota})),
 ...D.tags.map(t=>({t:t.tag,s:'Tag · '+t.categoria,v:'tags',i:ico('name_tag'),f:t.tag})),
 ...D.mc_tiendas.map(t=>({t:t.articulo,s:t.tienda+' · '+NF.format(t.precio)+' MC',v:'economia',i:ico('sunflower'),f:t.articulo})),
 ...VIEWS.map(v=>({t:v.t,s:'Sección',v:v.id,i:ico(v.ic)}))].map(e=>({...e,n:norm(e.t+' '+e.s)}));
const q=document.getElementById('q'),res=document.getElementById('res');let hits=[],sel=-1;
q.addEventListener('input',()=>{const v=norm(q.value.trim());sel=-1;if(v.length<2){res.hidden=true;return}const ts=v.split(/\s+/);
  hits=IDX.filter(e=>ts.every(t=>e.n.includes(t))).sort((a,b)=>(norm(b.t).startsWith(ts[0])-norm(a.t).startsWith(ts[0]))).slice(0,40);
  res.innerHTML=hits.length?hits.map((h,i)=>`<a href="#${h.v}" data-i="${i}">${h.i}<span><b>${esc(h.t)}</b><br><small>${esc(h.s)}</small></span><small>→</small></a>`).join(''):'<a><span></span><span>Sin resultados. Prueba con otra palabra.</span></a>';res.hidden=false;hydrate(res)});
res.addEventListener('click',e=>{const a=e.target.closest('a[data-i]');if(!a)return;e.preventDefault();const h=hits[+a.dataset.i];location.hash=h.v;show(h.v);res.hidden=true;
  if(h.go)h.go();else if(h.f){const tb=built[h.v].querySelector('#tb');if(tb&&tb.setFilter){tb.setFilter(h.f);tb.scrollIntoView({block:'start'})}}});
q.addEventListener('keydown',e=>{const it=[...res.querySelectorAll('a[data-i]')];if(!it.length)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+it.length)%it.length;it.forEach((a,i)=>a.classList.toggle('sel',i===sel))}if(e.key==='Enter')(it[sel]||it[0]).click();if(e.key==='Escape')res.hidden=true});
document.addEventListener('click',e=>{if(!e.target.closest('.dk-search'))res.hidden=true});
</script>
